<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zika-учебный сайт: услуги</title>

    <!-- Bootstrap 5 (только CSS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Свои стили подключаются ПОСЛЕ Bootstrap -->
    <link rel="stylesheet" href="style.css">
    <!-- Код калькулятора услуг (отдельный файл, чтобы не конфликтовать с script.js) -->
    <script src="service.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="site-header">
    <div class="container py-3">
        <div class="d-flex align-items-center gap-3">
            <a href="https://kubsu.ru/" title="КубГУ">
                <img class="site-logo" src="kubanskiy.jpg" alt="КубГУ">
            </a>
            <h1 class="h4 text-white mb-0">Zika-учебный сайт</h1>
        </div>
    </div>

    <nav class="navbar navbar-expand navbar-dark border-top border-light-subtle" aria-label="Основное меню">
        <div class="container">
            <ul class="navbar-nav flex-wrap">
                <li class="nav-item"><a class="nav-link" href="index.html#links">Ссылки</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#table">Таблица</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#form">Форма</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#calculator">Калькулятор</a></li>
                <li class="nav-item"><a class="nav-link active" href="service.html" aria-current="page">Услуги</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Галерея</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container py-4 flex-grow-1">
    <section id="calculator" class="card shadow-sm">
        <div class="card-body p-3 p-md-4">
            <h2 class="h3 mb-3">Калькулятор стоимости заказа</h2>

            <form id="calc-form" class="row g-3" action="#calculator" method="post">

                <div class="col-12 col-md-4">
                    <label class="form-label" for="quantity">Количество</label>
                    <input class="form-control" type="text" id="quantity" name="quantity" value="1"
                           inputmode="numeric" autocomplete="off">
                    <div class="invalid-feedback" id="quantity-error" role="alert"></div>
                </div>

                <fieldset class="col-12 col-md-8">
                    <legend class="fs-6 fw-bold">Тип товара</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="type-ticket" name="product-type"
                               value="ticket" checked>
                        <label class="form-check-label" for="type-ticket">Билет на концерт 9mice — 2000 ₽</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="type-shirt" name="product-type"
                               value="shirt">
                        <label class="form-check-label" for="type-shirt">Футболка Гоша Рубчинский — 5000 ₽</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="type-perfume" name="product-type"
                               value="perfume">
                        <label class="form-check-label" for="type-perfume">Духи Stronger With You — 15000 ₽</label>
                    </div>
                </fieldset>

                <!-- Только для футболки -->
                <div class="col-12 col-md-6 d-none" id="options-group">
                    <label class="form-label" for="product-option">Принт футболки</label>
                    <select class="form-select" id="product-option" name="option">
                        <option value="classic">Классический принт (+0 ₽)</option>
                        <option value="premium">Премиум-принт (+1000 ₽)</option>
                        <option value="limited">Лимитированная серия (+2500 ₽)</option>
                    </select>
                </div>

                <!-- Только для духов -->
                <div class="col-12 col-md-6 d-none" id="property-group">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="product-property" name="gift">
                        <label class="form-check-label" for="product-property">Подарочная упаковка (+500 ₽)</label>
                    </div>
                </div>

                <div class="col-12">
                    <p class="fs-4 mb-0" aria-live="polite">
                        Стоимость заказа: <strong id="total">—</strong>
                    </p>
                </div>

            </form>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="container py-3">
        <p class="mb-0">
            © 2026 Zika. Учебная работа по разработке Web-интерфейса.<br>
            Контактные данные: <a class="link-light" href="mailto:vladzika2007@mail.ru">vladzika2007@mail.ru</a>
        </p>
    </div>
</footer>

</body>
</html>
